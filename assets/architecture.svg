<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080c1c"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9c0ff"/>
      <stop offset="100%" stop-color="#00e6d0"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6ea8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1090" rx="20" fill="url(#bg)"/>

  <text x="700" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="url(#title)">Архитектура Open Universe</text>
  <text x="700" y="82" text-anchor="middle" font-size="15" fill="#93a0c4">Клиент на Unreal Engine 5 · единый шард на Rust · бинарный протокол между ними</text>

  <!-- CLIENT -->
  <rect x="50" y="110" width="1300" height="175" rx="18" fill="#6a8bff" fill-opacity="0.06" stroke="#6a8bff" stroke-opacity="0.35"/>
  <text x="76" y="145" font-size="15" font-weight="700" letter-spacing="1" fill="#8fb0ff">КЛИЕНТ — UNREAL ENGINE 5 (C++)</text>

  <g>
    <rect x="76" y="162" width="297" height="96" rx="12" fill="#6a8bff" fill-opacity="0.12" stroke="#6a8bff" stroke-opacity="0.3"/>
    <text x="224" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#e7ecff">Рендер: воксель и LOD</text>
    <text x="224" y="224" text-anchor="middle" font-size="12.5" fill="#93a0c4">стриминг чанков, мега-масштаб</text>
  </g>
  <g>
    <rect x="393" y="162" width="297" height="96" rx="12" fill="#6a8bff" fill-opacity="0.12" stroke="#6a8bff" stroke-opacity="0.3"/>
    <text x="541" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#e7ecff">Планеты и небесные тела</text>
    <text x="541" y="224" text-anchor="middle" font-size="12.5" fill="#93a0c4">сферы, атмосферы, чёрные дыры</text>
  </g>
  <g>
    <rect x="710" y="162" width="297" height="96" rx="12" fill="#6a8bff" fill-opacity="0.12" stroke="#6a8bff" stroke-opacity="0.3"/>
    <text x="858" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#e7ecff">Floating origin</text>
    <text x="858" y="224" text-anchor="middle" font-size="12.5" fill="#93a0c4">double precision, мир без дрожания</text>
  </g>
  <g>
    <rect x="1027" y="162" width="297" height="96" rx="12" fill="#6a8bff" fill-opacity="0.12" stroke="#6a8bff" stroke-opacity="0.3"/>
    <text x="1175" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#e7ecff">Предсказание и ввод</text>
    <text x="1175" y="224" text-anchor="middle" font-size="12.5" fill="#93a0c4">клиентский предикт, интерполяция</text>
  </g>

  <line x1="700" y1="287" x2="700" y2="311" stroke="#5b6ea8" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- PROTOCOL -->
  <rect x="170" y="315" width="1060" height="70" rx="35" fill="#00e6d0" fill-opacity="0.06" stroke="#00e6d0" stroke-opacity="0.4" stroke-dasharray="7 6"/>
  <text x="700" y="345" text-anchor="middle" font-size="15.5" font-weight="700" fill="#5fe9d6">СЕТЬ: UDP · бинарные дельты · FlatBuffers / protobuf</text>
  <text x="700" y="368" text-anchor="middle" font-size="12.5" fill="#93a0c4">единый контракт клиент ↔ сервер, дельта-синхронизация состояния</text>

  <line x1="700" y1="387" x2="700" y2="411" stroke="#5b6ea8" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- SERVER -->
  <rect x="50" y="415" width="1300" height="255" rx="18" fill="#00e6d0" fill-opacity="0.05" stroke="#00e6d0" stroke-opacity="0.34"/>
  <text x="76" y="450" font-size="15" font-weight="700" letter-spacing="1" fill="#5fe9d6">СЕРВЕР — RUST · ЕДИНЫЙ ШАРД (авторитетная симуляция)</text>

  <g fill="#e7ecff">
    <rect x="76" y="468" width="235" height="176" rx="12" fill="#00e6d0" fill-opacity="0.1" stroke="#00e6d0" stroke-opacity="0.28"/>
    <text x="193" y="500" text-anchor="middle" font-size="14.5" font-weight="600">Tick loop</text>
    <text x="193" y="526" text-anchor="middle" font-size="12" fill="#93a0c4">фиксированная</text>
    <text x="193" y="544" text-anchor="middle" font-size="12" fill="#93a0c4">частота 20–30 Гц</text>

    <rect x="329" y="468" width="235" height="176" rx="12" fill="#00e6d0" fill-opacity="0.1" stroke="#00e6d0" stroke-opacity="0.28"/>
    <text x="446" y="500" text-anchor="middle" font-size="14.5" font-weight="600">Авторитетная</text>
    <text x="446" y="520" text-anchor="middle" font-size="14.5" font-weight="600">кинематика</text>
    <text x="446" y="546" text-anchor="middle" font-size="12" fill="#93a0c4">своя физика,</text>
    <text x="446" y="564" text-anchor="middle" font-size="12" fill="#93a0c4">без физики UE</text>

    <rect x="582" y="468" width="235" height="176" rx="12" fill="#00e6d0" fill-opacity="0.1" stroke="#00e6d0" stroke-opacity="0.28"/>
    <text x="699" y="500" text-anchor="middle" font-size="14.5" font-weight="600">Interest</text>
    <text x="699" y="520" text-anchor="middle" font-size="14.5" font-weight="600">management</text>
    <text x="699" y="546" text-anchor="middle" font-size="12" fill="#93a0c4">репликация только</text>
    <text x="699" y="564" text-anchor="middle" font-size="12" fill="#93a0c4">того, что рядом</text>

    <rect x="835" y="468" width="235" height="176" rx="12" fill="#00e6d0" fill-opacity="0.1" stroke="#00e6d0" stroke-opacity="0.28"/>
    <text x="952" y="500" text-anchor="middle" font-size="14.5" font-weight="600">Власть над</text>
    <text x="952" y="520" text-anchor="middle" font-size="14.5" font-weight="600">контентом</text>
    <text x="952" y="546" text-anchor="middle" font-size="12" fill="#93a0c4">воксель, постройки,</text>
    <text x="952" y="564" text-anchor="middle" font-size="12" fill="#93a0c4">инвентарь, валидация</text>

    <rect x="1088" y="468" width="236" height="176" rx="12" fill="#00e6d0" fill-opacity="0.1" stroke="#00e6d0" stroke-opacity="0.28"/>
    <text x="1206" y="500" text-anchor="middle" font-size="14.5" font-weight="600">Скриптинг (Lua)</text>
    <text x="1206" y="526" text-anchor="middle" font-size="12" fill="#93a0c4">песочница, лимиты,</text>
    <text x="1206" y="544" text-anchor="middle" font-size="12" fill="#93a0c4">античит игроков</text>
  </g>

  <line x1="700" y1="672" x2="700" y2="696" stroke="#5b6ea8" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- SERVICES -->
  <rect x="50" y="700" width="1300" height="110" rx="18" fill="#a78bfa" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.32"/>
  <text x="76" y="731" font-size="15" font-weight="700" letter-spacing="1" fill="#c4b1ff">СЕРВИСЫ (микросервисы)</text>
  <g>
    <rect x="76" y="742" width="298" height="52" rx="10" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.26"/>
    <text x="225" y="774" text-anchor="middle" font-size="13.5" fill="#e7ecff">Auth · аккаунты и сессии</text>

    <rect x="394" y="742" width="298" height="52" rx="10" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.26"/>
    <text x="543" y="774" text-anchor="middle" font-size="13.5" fill="#e7ecff">Чат и голос</text>

    <rect x="712" y="742" width="298" height="52" rx="10" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.26"/>
    <text x="861" y="774" text-anchor="middle" font-size="13.5" fill="#e7ecff">Рынок и экономика</text>

    <rect x="1030" y="742" width="298" height="52" rx="10" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.26"/>
    <text x="1179" y="774" text-anchor="middle" font-size="13.5" fill="#e7ecff">Логистика и инвентарь</text>
  </g>

  <line x1="700" y1="812" x2="700" y2="836" stroke="#5b6ea8" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- DATA -->
  <rect x="50" y="840" width="1300" height="110" rx="18" fill="#ffc24b" fill-opacity="0.06" stroke="#ffc24b" stroke-opacity="0.32"/>
  <text x="76" y="871" font-size="15" font-weight="700" letter-spacing="1" fill="#ffd27a">ХРАНИЛИЩЕ ДАННЫХ</text>
  <g>
    <rect x="76" y="882" width="404" height="52" rx="10" fill="#ffc24b" fill-opacity="0.1" stroke="#ffc24b" stroke-opacity="0.26"/>
    <text x="278" y="914" text-anchor="middle" font-size="13.5" fill="#e7ecff">PostgreSQL — аккаунты, рынок, транзакции</text>

    <rect x="500" y="882" width="404" height="52" rx="10" fill="#ffc24b" fill-opacity="0.1" stroke="#ffc24b" stroke-opacity="0.26"/>
    <text x="702" y="914" text-anchor="middle" font-size="13.5" fill="#e7ecff">Объектное хранилище — воксель-чанки, blueprints</text>

    <rect x="924" y="882" width="404" height="52" rx="10" fill="#ffc24b" fill-opacity="0.1" stroke="#ffc24b" stroke-opacity="0.26"/>
    <text x="1126" y="914" text-anchor="middle" font-size="13.5" fill="#e7ecff">Spatial-индекс — зоны, системы, поиск</text>
  </g>

  <!-- INFRA -->
  <rect x="50" y="975" width="1300" height="78" rx="16" fill="none" stroke="#5b6ea8" stroke-opacity="0.5" stroke-dasharray="8 7"/>
  <text x="700" y="1012" text-anchor="middle" font-size="14.5" font-weight="700" fill="#93a0c4">ИНФРАСТРУКТУРА: Kubernetes · автомасштабирование по регионам · CI/CD (Perforce + Git LFS)</text>
  <text x="700" y="1035" text-anchor="middle" font-size="12.5" fill="#6b7695">мониторинг, логи и метрики · отказоустойчивость · резервные копии мира 24/7</text>
</svg>
