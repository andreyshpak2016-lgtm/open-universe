[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/sim",
  "crates/spatial",
  "crates/net",
  "crates/shard",
  "crates/persist",
  "crates/economy",
  "crates/combat",
  "crates/render",
  "crates/server",
  "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
