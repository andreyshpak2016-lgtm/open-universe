name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: Тесты и сборка ядра
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/**/Cargo.toml') }}

      - name: Тесты
        working-directory: server
        run: cargo test --workspace

      - name: Сборка (release)
        working-directory: server
        run: cargo build --release --workspace

      - name: Упаковка артефакта
        shell: pwsh
        run: |
          # Версия: из имени тега (vX.Y.Z) или из файла VERSION.
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+)$') { $v = $Matches[1] } else { $v = (Get-Content VERSION -Raw).Trim() }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Собираем единый набор: демо + сетевые + генератор + шард.
          $files = @(
            'server/target/release/ou-server.exe',
            'server/target/release/ou-client.exe',
            'server/target/release/ou-netd.exe',
            'server/target/release/ou-netclient.exe',
            'server/target/release/ou-worldgen.exe',
            'server/target/release/ou-shard-demo.exe',
            'server/target/release/ou-persist-demo.exe',
            'README.md'
          ) | Where-Object { Test-Path $_ }
          Compress-Archive -Path $files -DestinationPath "dist/open-universe-$v-windows-x64.zip" -Force
          Write-Host "Собран архив для версии $v с $($files.Count) файлами"

      - name: Приложить сборку к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          # Заметки не генерируем автоматически: релиз создаётся с CHANGELOG,
          # а этот шаг лишь догружает артефакт (идемпотентно).
          generate_release_notes: false
          draft: false
          name: Open Universe ${{ github.ref_name }}
