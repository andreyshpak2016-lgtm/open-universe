name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: РўРµСЃС‚С‹ Рё СЃР±РѕСЂРєР° СЏРґСЂР°
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Rust
        uses: dtolnay/rust-toolchain@stable

      - name: РљСЌС€ cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/**/Cargo.toml') }}

      - name: РўРµСЃС‚С‹
        working-directory: server
        run: cargo test --workspace

      - name: РџСЂРѕРІРµСЂРєР° РєР»РёРµРЅС‚СЃРєРѕРіРѕ РїСЂРѕС‚РѕРєРѕР»Р° (C++)
        shell: pwsh
        run: |
          # РЎС‚РµРЅРґ СЂР°Р·Р±РёСЂР°РµС‚ СЂРµР°Р»СЊРЅС‹Р№ РїР°РєРµС‚ СЃРµСЂРІРµСЂР° С‚РµРј Р¶Рµ РєРѕРґРѕРј, С‡С‚Рѕ Рё РєР»РёРµРЅС‚ UE5.
          ./tools/test-client.ps1

      - name: РЎР±РѕСЂРєР° (release)
        working-directory: server
        run: cargo build --release --workspace

      - name: РЈРїР°РєРѕРІРєР° Р°СЂС‚РµС„Р°РєС‚Р°
        shell: pwsh
        run: |
          # Р’РµСЂСЃРёСЏ: РёР· РёРјРµРЅРё С‚РµРіР° (vX.Y.Z) РёР»Рё РёР· С„Р°Р№Р»Р° VERSION.
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+)$') { $v = $Matches[1] } else { $v = (Get-Content VERSION -Raw).Trim() }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # РЎРѕР±РёСЂР°РµРј РµРґРёРЅС‹Р№ РЅР°Р±РѕСЂ: РґРµРјРѕ + СЃРµС‚РµРІС‹Рµ + РіРµРЅРµСЂР°С‚РѕСЂ + С€Р°СЂРґ.
          $files = @(
            'server/target/release/ou-server.exe',
            'server/target/release/ou-client.exe',
            'server/target/release/ou-netd.exe',
            'server/target/release/ou-netclient.exe',
            'server/target/release/ou-worldgen.exe',
            'server/target/release/ou-shard-demo.exe',
            'server/target/release/ou-persist-demo.exe',
            'server/target/release/ou-market-demo.exe',
            'server/target/release/ou-combat-demo.exe',
            'server/target/release/ou-render.exe',
            'server/target/release/ou-netrender.exe',
            'server/target/release/ou-landing-demo.exe',
            'server/target/release/ou-script-demo.exe',
            'server/target/release/ou-market-sim.exe',
            'server/target/release/ou-build-demo.exe',
            'server/target/release/ou-dump-packet.exe',
            'tools/play.ps1',
            'play.bat',
            'README.md'
          ) | Where-Object { Test-Path $_ }
          Compress-Archive -Path $files -DestinationPath "dist/open-universe-$v-windows-x64.zip" -Force
          $count = $files.Count
          Write-Host "Собран архив версии $v, файлов: $count"

      - name: РџСЂРёР»РѕР¶РёС‚СЊ СЃР±РѕСЂРєСѓ Рє СЂРµР»РёР·Сѓ
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          # Р—Р°РјРµС‚РєРё РЅРµ РіРµРЅРµСЂРёСЂСѓРµРј Р°РІС‚РѕРјР°С‚РёС‡РµСЃРєРё: СЂРµР»РёР· СЃРѕР·РґР°С‘С‚СЃСЏ СЃ CHANGELOG,
          # Р° СЌС‚РѕС‚ С€Р°Рі Р»РёС€СЊ РґРѕРіСЂСѓР¶Р°РµС‚ Р°СЂС‚РµС„Р°РєС‚ (РёРґРµРјРїРѕС‚РµРЅС‚РЅРѕ).
          generate_release_notes: false
          draft: false
          name: Open Universe ${{ github.ref_name }}
