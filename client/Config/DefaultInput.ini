[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bCaptureMouseOnLaunch=True

; Классические оси/действия: работают без ассетов и Blueprint.
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="Yaw",Scale=-1.000000,Key=D)
+AxisMappings=(AxisName="Yaw",Scale=1.000000,Key=A)
+AxisMappings=(AxisName="Pitch",Scale=-1.000000,Key=Up)
+AxisMappings=(AxisName="Pitch",Scale=1.000000,Key=Down)
+AxisMappings=(AxisName="Yaw",Scale=-1.000000,Key=Right)
+AxisMappings=(AxisName="Yaw",Scale=1.000000,Key=Left)
+ActionMappings=(ActionName="Fire",Key=SpaceBar)
+ActionMappings=(ActionName="ExitShip",Key=F)
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
; Огонь персонажем (ручное оружие) — правая кнопка мыши, чтобы не мешать прыжку.
+ActionMappings=(ActionName="FireWeapon",Key=RightMouseButton)
; Строительство: B — меню, ЛКМ — поставить блок, колесо — выбор блока.
; E — удалить блок под прицелом, R — перекрасить его в выбранный цвет.
+ActionMappings=(ActionName="BuildMode",Key=B)
+ActionMappings=(ActionName="BuildPlace",Key=LeftMouseButton)
+ActionMappings=(ActionName="BuildRemove",Key=E)
+ActionMappings=(ActionName="BuildPaint",Key=R)
+ActionMappings=(ActionName="BuildNext",Key=MouseScrollUp)
+ActionMappings=(ActionName="BuildPrev",Key=MouseScrollDown)
; Обзор: МЫШЬ (как в Dual Universe) + стрелки как запасной вариант.
; Мышь захвачена в игре; Alt отпускает курсор для интерфейса.
+AxisMappings=(AxisName="LookYawMouse",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookPitchMouse",Scale=-1.000000,Key=MouseY)
+AxisMappings=(AxisName="LookYaw",Scale=1.000000,Key=Right)
+AxisMappings=(AxisName="LookYaw",Scale=-1.000000,Key=Left)
+AxisMappings=(AxisName="LookPitch",Scale=1.000000,Key=Down)
+AxisMappings=(AxisName="LookPitch",Scale=-1.000000,Key=Up)
; Alt — отпустить/вернуть курсор (интерфейс/строительство).
+ActionMappings=(ActionName="CursorToggle",Key=LeftAlt)
; Корабль: мышь ведёт обзор (отдельные оси, чтобы дельта не зависела от FPS).
; W/S — тяга вперёд/назад, A/D — рыскание (как в Dual Universe).
+AxisMappings=(AxisName="YawMouse",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="PitchMouse",Scale=-1.000000,Key=MouseY)
+AxisMappings=(AxisName="Strafe",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="Strafe",Scale=-1.000000,Key=A)
+ActionMappings=(ActionName="Ascend",Key=SpaceBar)
+ActionMappings=(ActionName="Descend",Key=LeftControl)
; Меню персонажа/сервера: клик мышью и забой символа.
+ActionMappings=(ActionName="MenuClick",Key=LeftMouseButton)
+ActionMappings=(ActionName="MenuBackspace",Key=BackSpace)
